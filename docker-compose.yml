services:
  mongo:
    image: mongo:7
    container_name: surveillance_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: surveillance_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  redis_data:

# ── Dev run instructions ──────────────────────────────────────────────────────
# Start services:      docker compose up -d
# Start API:           cd backend && uvicorn app.main:app --reload
# Start Celery worker: cd backend && celery -A app.tasks.celery_app worker --loglevel=info
# Start frontend:      cd frontend && npm run dev
